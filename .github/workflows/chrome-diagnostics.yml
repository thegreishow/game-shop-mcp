name: Game Shop Chrome Diagnostics

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: HTTPS preview URL to diagnose
        required: true
        type: string
      project_id:
        description: Game Shop project id
        required: false
        type: string
      execution_id:
        description: Game Shop execution id
        required: false
        type: string
      commit_sha:
        description: Target project commit SHA represented by the preview
        required: false
        type: string

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      CHROME_DEVTOOLS_MCP_NO_USAGE_STATISTICS: true
      CHROME_DEVTOOLS_MCP_NO_UPDATE_CHECKS: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chrome DevTools MCP CLI
        run: npm install -g chrome-devtools-mcp@latest
      - name: Prepare evidence workspace
        run: mkdir -p .gameshop-chrome
      - name: Execute Chrome diagnostics
        id: chrome_contract
        continue-on-error: true
        env:
          GAME_SHOP_CHROME_TARGET_URL: ${{ inputs.target_url }}
          GAME_SHOP_CHROME_PROJECT_ID: ${{ inputs.project_id }}
          GAME_SHOP_CHROME_EXECUTION_ID: ${{ inputs.execution_id }}
        run: npx tsx scripts/chrome-diagnostics.ts
      - name: Publish terminal evidence to Game Shop
        if: always()
        env:
          WORKER_SECRET: ${{ secrets.GAME_SHOP_WORKER_SECRET }}
          GAME_SHOP_BASE_URL: ${{ vars.GAME_SHOP_BASE_URL || 'https://game-shop-mcp.vercel.app' }}
          PROJECT_ID: ${{ inputs.project_id }}
          EXECUTION_ID: ${{ inputs.execution_id }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          PREVIEW_URL: ${{ inputs.target_url }}
          RUN_ID: ${{ github.run_id }}
          QA_OUTCOME: ${{ steps.chrome_contract.outcome }}
        run: |
          if [ -z "$WORKER_SECRET" ] || [ -z "$PROJECT_ID" ]; then
            echo "Evidence callback skipped: GAME_SHOP_WORKER_SECRET or project_id missing."
            exit 0
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='.gameshop-chrome/evidence.json';
          let evidence={};
          try { evidence=JSON.parse(fs.readFileSync(path,'utf8')); } catch (error) { evidence={readError:String(error)}; }
          const body={projectId:process.env.PROJECT_ID,executionId:process.env.EXECUTION_ID||undefined,provider:'chrome-devtools-mcp',runId:process.env.RUN_ID,commitSha:process.env.COMMIT_SHA||undefined,previewUrl:process.env.PREVIEW_URL,status:process.env.QA_OUTCOME==='success'?'passed':'failed',evidence};
          const response=await fetch(`${process.env.GAME_SHOP_BASE_URL}/qa/evidence`,{method:'POST',headers:{authorization:`Bearer ${process.env.WORKER_SECRET}`,'content-type':'application/json'},body:JSON.stringify(body)});
          if(!response.ok)throw new Error(`Evidence callback failed: ${response.status} ${await response.text()}`);
          console.log('Game Shop evidence callback accepted.');
          NODE
      - name: Upload diagnostics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameshop-chrome-diagnostics
          path: .gameshop-chrome/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop Chrome DevTools daemon
        if: always()
        run: chrome-devtools stop || true
      - name: Preserve diagnostics failure status
        if: steps.chrome_contract.outcome == 'failure'
        run: exit 1
