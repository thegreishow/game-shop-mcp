name: Game Shop CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Vercel deployment policy
        run: node scripts/check-vercel-deployment-policy.mjs
      - name: Vercel function budget
        run: node scripts/check-vercel-function-budget.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: MCP smoke tests
        run: npm run test:mcp
      - name: OAuth PKCE smoke tests
        run: npm run test:oauth
      - name: Adversarial security tests
        run: npm run test:security
      - name: SDK Hub Phase 2 smoke
        run: npm run test:sdk-hub
      - name: Provider health smoke
        run: npm run test:provider-health
      - name: Generate machine-readable ecosystem snapshots
        run: npm run snapshot:ecosystem
      - name: Validate generated JSON
        run: node -e 'JSON.parse(require("fs").readFileSync("ecosystem.json","utf8")); JSON.parse(require("fs").readFileSync("mcp.json","utf8")); console.log("snapshot JSON valid")'
